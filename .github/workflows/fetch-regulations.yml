name: Fetch regulations into the store

# Fill the document store from the register in backend/seed/dg/sources.json and
# keep the volumes in the Actions cache, where the reading and extraction
# workflows already look. The development container often cannot reach the
# publishers (UNECE refuses non-browser requests and the proxy blocks the rest);
# a runner can, and once a volume is in the cache every later run starts warm.
#
# Nothing is committed and nothing is published: the cache is repository-
# internal storage, the documents stay out of git, and the only thing that may
# change in the repository is a pinned sha256 in sources.json — which is a fact
# about a file, not the file.

on:
  workflow_dispatch:
    inputs:
      ids:
        description: "Document ids to fetch (space separated); empty means everything fetchable"
        default: ""
        required: false
      probe_url:
        description: "Fetch these URLs (space separated) and print what they answer, instead of fetching documents. The development container's proxy blocks most hosts; the runner does not, so this is how a mirror or share page gets looked at."
        default: ""
        required: false
      drive_folder:
        description: "Download a public Google Drive folder into the store's incoming directory and adopt what is recognised"
        default: ""
        required: false
      adopt_as:
        description: "Mappings for unrecognised incoming files, one per line: filename.pdf=document-id"
        default: ""
        required: false
      artifact_path:
        description: "Hand a part of the store back as a run artifact (path relative to the store root, e.g. incoming/Reference), kept one day. This is how reference material the development container cannot fetch itself reaches it."
        default: ""
        required: false
      find_provision:
        description: "Which model to look for: 5.4.3 (instructions), 8.6.3 (ADN checklist), 8.6.4 (degassing checklist)"
        default: "5.4.3"
        required: false
      find_instructions:
        description: "Report where the four-page model of 5.4.3 sits in these stored documents (ids, space separated)"
        default: ""
        required: false
      verify_instructions:
        description: "Cut every registered model of 5.4.3 out of the store and print what came out"
        type: boolean
        default: false
      dump_text:
        description: "Print the full text of short stored PDFs matching this pattern (relative to the store root, e.g. incoming/Imdg/*Corrigenda*)"
        default: ""
        required: false

# Write, for the one step that hands a part of the store back as a draft
# release; everything else only reads.
permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache/restore@v4
        with:
          path: /tmp/emcargo-regulations
          key: regulations-${{ github.run_id }}
          restore-keys: |
            regulations-

      - name: Look at a URL
        if: ${{ inputs.probe_url != '' }}
        env:
          URL: ${{ inputs.probe_url }}
        run: |
          set -uo pipefail
          # The publishers answer a bare request with 403 — measured on
          # unece.org, which is behind Cloudflare. The reader's ladder starts
          # with browser headers for that reason, so the probe starts there too.
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          for URL in $URL; do
          echo "############ $URL"
          echo "=== headers ==="
          curl -sS -L -A "$UA" -H "Accept: text/html,application/pdf,*/*" -I "$URL" || true
          curl -sS -L -A "$UA" -H "Accept: text/html,application/pdf,*/*" "$URL" -o /tmp/probe.bin || true
          if file /tmp/probe.bin | grep -qi 'html\|text'; then
            # A landing page is asked for because of what it links to. Printing
            # two thousand bytes of it says nothing: the links are the answer.
            echo "=== links to documents ==="
            grep -o 'href="[^"]*"' /tmp/probe.bin \
              | grep -iE '\.pdf|\.docx?' | sort -u | head -80 || true
            echo "=== headings ==="
            grep -o '<title>[^<]*</title>' /tmp/probe.bin | head -3 || true
          else
            echo "=== body, first 2000 bytes (binary) ==="
            ls -l /tmp/probe.bin
            head -c 2000 /tmp/probe.bin | od -c | head -20 || true
          fi
          done

      - name: Take in a Drive folder
        if: ${{ inputs.drive_folder != '' }}
        env:
          FOLDER: ${{ inputs.drive_folder }}
          ADOPT_AS: ${{ inputs.adopt_as }}
        run: |
          set -euo pipefail
          pip install --quiet gdown
          mkdir -p /tmp/emcargo-regulations/incoming
          # Drive rations the public links: after some tens of files in one
          # go it refuses the next with "many accesses". Measured on a folder
          # of forty files, which failed on the last one. What did arrive is
          # still worth listing, surveying and adopting, so the failure is
          # reported and the step goes on.
          gdown --folder "$FOLDER" -O /tmp/emcargo-regulations/incoming \
            || echo "::warning::gdown ended with an error (Drive's access ration, most likely); what did arrive is listed below"
          echo "=== incoming (recursive: a Drive folder arrives as a tree) ==="
          find /tmp/emcargo-regulations/incoming -type f -printf '%10s  %p\n' | sort -k2
          # Reconnaissance before anything is registered: what each PDF is,
          # whether it has a text layer, and where its readable parts sit.
          pip install --quiet pymupdf
          python scripts/survey_incoming.py /tmp/emcargo-regulations/incoming
          # One mapping per line, not per word: the files an operator uploads
          # are named "ADR 2025 French.pdf" as often as not, and splitting the
          # input on spaces would cut such a name in three.
          printf '%s\n' "$ADOPT_AS" > /tmp/adopt-as.txt
          python scripts/regulations_store.py adopt \
            /tmp/emcargo-regulations/incoming --map-file /tmp/adopt-as.txt

      - name: Where the instructions model sits
        if: ${{ inputs.find_instructions != '' }}
        env:
          IDS: ${{ inputs.find_instructions }}
          PROVISION: ${{ inputs.find_provision }}
        run: |
          set -euo pipefail
          pip install --quiet pymupdf
          python scripts/regulations_store.py path $IDS > /tmp/paths.txt || true
          cat /tmp/paths.txt
          xargs -r python scripts/find_instructions_pages.py \
            --provision "${PROVISION:-5.4.3}" < /tmp/paths.txt

      - name: Cut every model and look at it
        if: ${{ inputs.verify_instructions }}
        env:
          PROVISION: ${{ inputs.find_provision }}
        run: |
          set -euo pipefail
          pip install --quiet pymupdf
          python scripts/check_instruction_models.py "${PROVISION:-5.4.3}"

      - name: Read a short document aloud
        if: ${{ inputs.dump_text != '' }}
        env:
          PATTERN: ${{ inputs.dump_text }}
        run: |
          set -euo pipefail
          pip install --quiet pymupdf
          python scripts/dump_pdf_text.py /tmp/emcargo-regulations "$PATTERN"

      # The way back. The cache is repository-internal storage the container
      # cannot read; an artifact is repository-internal storage it can, for a
      # day. Nothing is published: an artifact is visible to the repository's
      # collaborators only, like the cache it comes from.
      - name: Hand a part of the store back
        if: ${{ inputs.artifact_path != '' }}
        env:
          ARTIFACT_PATH: ${{ inputs.artifact_path }}
        run: |
          set -euo pipefail
          test -e "/tmp/emcargo-regulations/$ARTIFACT_PATH"
          echo "=== $ARTIFACT_PATH ==="
          find "/tmp/emcargo-regulations/$ARTIFACT_PATH" -type f -printf '%10s  %p\n' | sort -k2
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.artifact_path != '' }}
        with:
          name: store-part
          path: /tmp/emcargo-regulations/${{ inputs.artifact_path }}
          retention-days: 1
          if-no-files-found: error

      # The same part once more, as the asset of a draft release. An artifact
      # is served from a blob store the development container's proxy refuses
      # (measured: CONNECT to productionresultssa*.blob.core.windows.net is
      # denied); a release asset is served from objects.githubusercontent.com,
      # which it allows. A draft release has no tag and is invisible to anyone
      # but the repository's collaborators, and it is deleted once read.
      - name: Hand it back as a draft release too
        if: ${{ inputs.artifact_path != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_PATH: ${{ inputs.artifact_path }}
        run: |
          set -euo pipefail
          # The container's token can read a draft but not delete one, so the
          # previous hand-backs are cleared here, before the next is made.
          gh release list --json name,isDraft,tagName --limit 50 \
            | python3 -c "import json,sys; [print(r['tagName']) for r in json.load(sys.stdin) if r['isDraft'] and r['tagName'].startswith('store-part-')]" \
            | xargs -r -n1 gh release delete --yes
          (cd /tmp/emcargo-regulations && zip -q -r /tmp/store-part.zip "$ARTIFACT_PATH")
          ls -l /tmp/store-part.zip
          gh release create "store-part-${{ github.run_id }}" /tmp/store-part.zip \
            --draft --title "store part ${{ github.run_id }} (draft, delete after reading)" \
            --notes "Part of the regulation store handed back to the development container: $ARTIFACT_PATH. Not a release; delete once read."

      - name: Fetch what is missing
        if: ${{ inputs.probe_url == '' && inputs.drive_folder == '' && inputs.artifact_path == '' && inputs.find_instructions == '' && !inputs.verify_instructions && inputs.dump_text == '' }}
        run: python scripts/regulations_store.py fetch ${{ inputs.ids }}

      # Not after a page-range measurement: that report is what the run is for,
      # and a store listing under it only pushes it out of reach of a log tail.
      - name: Report the store
        if: ${{ always() && inputs.probe_url == '' && inputs.find_instructions == '' && !inputs.verify_instructions && inputs.dump_text == '' }}
        env:
          IGNORED: report runs after fetch and after adopt alike
        run: python scripts/regulations_store.py status || true

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: /tmp/emcargo-regulations
          key: regulations-${{ github.run_id }}
