name: Extract ADR proper shipping names

# Reads column (2) of table A out of ADR 2025 in English and in French and puts
# the names in backend/seed/dg/adr_names_<language>.json.
#
# It runs here and not locally for the same reason the regulation reader does:
# UNECE is not reachable from the development container, and a runner reaches it
# fine. The volumes are published free of charge; the books do not go into the
# repository, only the derived names.
#
# The script refuses to write below an agreement threshold against the Dutch
# table A already in the repository. It compares UN numbers and not names — the
# names are supposed to differ, the set of rows is not — so a column boundary
# that has slipped shows up as missing entries rather than passing unnoticed.

on:
  workflow_dispatch:
    inputs:
      language:
        description: "Which edition to read"
        type: choice
        options:
          - en
          - fr
          - de
          - both
        default: both
      source:
        description: "Probe a different registered text instead (e.g. adn), layout only"
        default: ""
        required: false
      probe:
        description: "Report the layout of the edition and stop"
        type: boolean
        default: false
      explain:
        description: "Trace these UN numbers line by line ('auto' = the rows the reading loses)"
        default: ""
        required: false
      commit:
        description: "Commit the result to this branch"
        type: boolean
        default: false
      min_agreement:
        description: "Below this agreement nothing is written"
        default: "0.98"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pymupdf

      # Keep the volumes between runs. UNECE refuses a runner outright (403) and
      # the Internet Archive, which is the way round, rate-limits after a few
      # asks — it answered 503 twice and then 498 for the ADN, and each of those
      # cost a whole run. The books do not change: once a volume has been
      # fetched, every later run should read it off the disk and not ask anyone.
      # `restore-keys` matters more than the key here — a run that adds a new
      # source still starts from the volumes already downloaded, instead of
      # going back to the Archive for all of them.
      - name: Volumes already fetched
        id: volumes
        uses: actions/cache/restore@v4
        with:
          path: /tmp/emcargo-regulations
          key: regulations-${{ github.run_id }}
          restore-keys: |
            regulations-

      - name: Read the volumes
        env:
          LANGUAGE: ${{ inputs.language }}
          MIN_AGREEMENT: ${{ inputs.min_agreement }}
          PROBE: ${{ inputs.probe }}
          SOURCE: ${{ inputs.source }}
          EXPLAIN: ${{ inputs.explain }}
        run: |
          set -euo pipefail
          # The download goes through read_land_regulations.py, which is the one
          # place that knows how to get these files: UNECE answers a bare
          # request from a runner with 403, and that module tries browser
          # headers first and the web archive after.
          # A named source overrides the language map. Used to look at the
          # layout of a text this reader has not met before — ADN table C is a
          # different table with different columns, and guessing at it across a
          # runner round-trip is what cost six of them on the ADR.
          if [ -n "$SOURCE" ]; then
            echo "=============================================================="
            echo "layout of $SOURCE"
            echo "=============================================================="
            python scripts/extract_adr_names_multilingual.py \
              --source "$SOURCE" --probe
            exit 0
          fi
          LANGS="$LANGUAGE"
          if [ "$LANGUAGE" = "both" ]; then LANGS="en fr"; fi
          # One language failing its agreement gate must not take the other's
          # reading with it: a run that reports both is a run worth its round
          # trip, and the failure is still a failure at the end.
          FAILED=0
          for lang in $LANGS; do
            echo "=============================================================="
            echo "ADR 2025 Volume I — $lang"
            echo "=============================================================="
            source_id="adr1"
            if [ "$lang" = "fr" ]; then source_id="adr1_fr"; fi
            # German is the one language UNECE does not publish. It comes from
            # the operator-supplied national edition in the store, which is a
            # different typesetting and is therefore read from its file rather
            # than through the download ladder.
            if [ "$lang" = "de" ]; then source_id="adr_de_1"; fi
            EXTRA=""
            if [ "$PROBE" = "true" ]; then EXTRA="--probe"; fi
            if [ -n "$EXPLAIN" ]; then EXTRA="$EXTRA --explain $EXPLAIN"; fi
            if [ "$lang" = "de" ]; then
              PDF=$(python scripts/regulations_store.py path "$source_id")
              python scripts/extract_adr_names_multilingual.py \
                --pdf "$PDF" --language "$lang" \
                --min-agreement "$MIN_AGREEMENT" $EXTRA || FAILED=1
            else
              python scripts/extract_adr_names_multilingual.py \
                --source "$source_id" --language "$lang" \
                --min-agreement "$MIN_AGREEMENT" $EXTRA || FAILED=1
            fi
          done
          exit $FAILED

      # Save even when the reading failed. The run that fetched ADR and then
      # tripped over ADN is exactly the one whose ADR download must survive —
      # `actions/cache` on its own skips the save when the job fails, which
      # would send the next run back to the Archive for a volume it already had.
      - name: Keep the volumes for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /tmp/emcargo-regulations
          key: regulations-${{ github.run_id }}

      - name: Commit
        if: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/seed/dg/adr_names_*.json
          if git diff --cached --quiet; then
            echo "Unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "Read the ADR 2025 proper shipping names in English and French

          Column (2) of table A, from the official UNECE editions, checked
          against the Dutch table A already in the repository."
          git push origin HEAD:${GITHUB_REF_NAME}
