name: Extract ADN table C

# Reads table C — the tank vessel substances — out of the English ADN 2025 and
# hands the rows back as a run artifact. The Dutch reading comes from the
# operator-supplied index in the document store and happens in the development
# container; this workflow is the English half, because the PDF lives in the
# Actions cache where the fetch workflow put it and the development container
# cannot reach the publisher.
#
# Nothing is committed here. The two readings are compared in the development
# container, and only a comparison with every disagreement accounted for
# becomes backend/seed/dg/adn_table_c.json — the rule for regulatory tables.

on:
  workflow_dispatch:
    inputs:
      probe:
        description: "Report the layout of the table C pages and stop"
        type: boolean
        default: false
      dump:
        description: "Print every row to the log as well (the development container cannot reach the artifact store)"
        type: boolean
        default: false
      probe_page:
        description: "Dump every word of this PDF page with coordinates and stop"
        default: ""
        required: false
      language:
        description: "Which edition to read: en (adn.pdf), fr (adn_fr.pdf) or nl (the printed Dutch book)"
        type: choice
        options:
          - en
          - fr
          - nl
        default: en

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pymupdf

      - name: Volumes already fetched
        uses: actions/cache/restore@v4
        with:
          path: /tmp/emcargo-regulations
          key: regulations-${{ github.run_id }}
          restore-keys: |
            regulations-

      - name: The edition must be in the store
        env:
          LANGUAGE: ${{ inputs.language }}
        run: |
          set -euo pipefail
          case "$LANGUAGE" in
            fr) python scripts/regulations_store.py fetch adn_fr ;;
            # The Dutch edition is operator-supplied: nothing to fetch, it is
            # either in the store or the run has nothing to read.
            nl) python scripts/regulations_store.py path adn_nl_2025 ;;
            *)  python scripts/regulations_store.py fetch adn ;;
          esac

      - name: Read table C
        env:
          PROBE: ${{ inputs.probe }}
          DUMP: ${{ inputs.dump }}
          PROBE_PAGE: ${{ inputs.probe_page }}
          LANGUAGE: ${{ inputs.language }}
        run: |
          set -euo pipefail
          EXTRA=""
          if [ "$PROBE" = "true" ]; then EXTRA="--probe"; fi
          if [ "$DUMP" = "true" ]; then EXTRA="$EXTRA --dump"; fi
          if [ -n "$PROBE_PAGE" ]; then EXTRA="$EXTRA --probe-page $PROBE_PAGE"; fi
          PDF=/tmp/emcargo-regulations/adn.pdf
          if [ "$LANGUAGE" = "fr" ]; then PDF=/tmp/emcargo-regulations/adn_fr.pdf; fi
          if [ "$LANGUAGE" = "nl" ]; then
            # The printed Dutch edition sets table C the ordinary way round,
            # so it is read across the page and not down it.
            PDF=$(python scripts/regulations_store.py path adn_nl_2025)
            python scripts/extract_adn_table_c.py \
              --dutch-book "$PDF" --out table_c_nl.json $EXTRA
          else
            python scripts/extract_adn_table_c.py \
              --english "$PDF" --language "$LANGUAGE" \
              --out "table_c_$LANGUAGE.json" $EXTRA
          fi

      # Even a run with failures hands back what it read: the comparison in the
      # development container is where shortfalls are diagnosed, and it needs
      # the file to do it.
      - name: Hand the rows back
        if: ${{ always() && !inputs.probe }}
        uses: actions/upload-artifact@v4
        with:
          name: adn-table-c-${{ inputs.language }}
          path: table_c_${{ inputs.language }}.json

      - name: Keep the volumes for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /tmp/emcargo-regulations
          key: regulations-${{ github.run_id }}
