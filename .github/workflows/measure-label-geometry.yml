name: Measure figures

# What "100 mm x 100 mm" means for a diamond-shaped label is not settled by the
# sentence that says it: the square's side and the bounding box are both
# readings that survive it, and they differ by a factor of the square root of
# two. Getting it wrong prints every label at the wrong size.
#
# The figures in the official editions are vector art, so the shapes can be
# measured instead of interpreted. This runs that measurement here, because the
# development container cannot reach the publishers.
#
# It commits nothing. Only the conclusion a human draws from the run log enters
# the repository, through a reviewed change, in the manner
# docs/data-sources.md promises.

on:
  workflow_dispatch:
    inputs:
      doc:
        description: "Document id from seed/dg/sources.json (adr2, imdg_42_24, rid, adn)"
        default: "adr2"
        required: false
      pages:
        description: "PDF page or range, 1-based, at most 12 pages (e.g. 247-252)"
        default: "247-252"
        required: false
      what:
        description: "geometry = measure the drawn shapes; crops = find figure crop boxes with ASCII sketches"
        type: choice
        options:
          - geometry
          - crops
        default: geometry
      box:
        description: "crops only: look closely at one box instead of searching pages, as page,x0,y0,x1,y1 (several separated by ;)"
        default: ""
        required: false
      min_side:
        description: "crops only: ignore blobs narrower or shorter than this many points"
        default: "30"
        required: false

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install --quiet pymupdf

      # The same cache the reader uses: a run that measures one figure should
      # not re-fetch 19 MB that another run already has.
      - name: Volumes already fetched
        uses: actions/cache/restore@v4
        with:
          path: /tmp/emcargo-regulations
          key: regulations-${{ github.run_id }}
          restore-keys: |
            regulations-

      - name: Measure the figures
        env:
          DOC: ${{ inputs.doc }}
          PAGES: ${{ inputs.pages }}
          WHAT: ${{ inputs.what || 'geometry' }}
          BOX: ${{ inputs.box }}
          MIN_SIDE: ${{ inputs.min_side }}
        run: |
          set -euo pipefail
          ARGS=(--doc "$(echo "$DOC" | tr -d '[:space:]')")
          SCRIPT=scripts/measure_label_geometry.py
          if [ "$WHAT" = "crops" ]; then
            SCRIPT=scripts/measure_figure_crops.py
          fi
          # A close look at one box replaces the page search; asking for both
          # would print a search nobody read to get to the picture they wanted.
          if [ "$WHAT" = "crops" ] && [ -n "$BOX" ]; then
            IFS=';' read -ra WANTED <<< "$BOX"
            for b in "${WANTED[@]}"; do
              ARGS+=(--box "$(echo "$b" | tr -d '[:space:]')")
            done
          else
            ARGS+=(--pages "$(echo "$PAGES" | tr -d '[:space:]')")
            if [ "$WHAT" = "crops" ] && [ -n "${MIN_SIDE:-}" ]; then
              ARGS+=(--min-side "$(echo "$MIN_SIDE" | tr -d '[:space:]')")
            fi
          fi
          python "$SCRIPT" "${ARGS[@]}"
