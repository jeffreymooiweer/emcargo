name: CI

# One workflow on every push and every pull request. It was not that.
#
# ci.yml and dockerhub.yml were both called "CI" and both ran on a push to main
# and on every pull request. They largely did the same work: pytest ran twice,
# `npm ci` and the frontend build ran twice. Five checks per push, of which two
# were a copy of two others. On a release with three commits on the branch that
# was fifteen jobs before anything had been merged.
#
# The second cost was the Docker build. It built linux/amd64 *and* linux/arm64,
# and arm64 runs on an amd64 runner under QEMU emulation: that is where the five
# to nine minutes went. On a pull request the result was then thrown away,
# because nothing is pushed there.
#
# So: one workflow, every step once, and arm64 only when an image is actually
# published. On a pull request the Docker build is a smoke test — does the
# Dockerfile still build? — and amd64 is enough for that.
#
# This does not run on a tag. The image of a release is not rebuilt but renamed:
# `tag-release.yml` puts the version tag with `imagetools create` on the manifest
# built and pushed here on main. That saves a second compilation of the same
# commit, and it is stricter — what is released is bit for bit what went green
# here.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Whoever pushes three times in a row does not need the result of the first two.
# On main and on a tag everything runs to the end: a publication hangs off those.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-runtime.txt

      # This gate deliberately comes *before* the installation: it costs a second
      # and catches the mistake the release workflow used to repair on main.
      - name: Check version consistency
        run: python scripts/check_versions.py

      - run: pip install -r backend/requirements.txt

      - name: Validate installed Python dependencies
        run: pip check

      # DATA_DIR and DATABASE_URL point at /data by default and that does not
      # exist here; the backend seeds its catalogues into that folder at startup.
      - name: Tests
        working-directory: backend
        env:
          DATA_DIR: ${{ github.workspace }}/data
          DATABASE_URL: sqlite:///${{ github.workspace }}/data/test.db
          APP_ENV: test
          APP_SECRET_KEY: ci-secret
          CATALOG_AUTO_SYNC: "false"
        run: |
          mkdir -p "${{ github.workspace }}/data"
          python -m pytest -q

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # jsdom 30 requires "^22.22.2 || ^24.15.0 || >=26" and undici 8 ">=22.19.0".
          # On Node 20 `npm test` falls over before a single test runs, with
          # "webidl.util.markAsUncloneable is not a function" from undici.
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: Tests
        working-directory: frontend
        run: npm test

      - name: Typecheck and build
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # On a pull request nothing is pushed, so no arm64 has to be built either.
      # That saves the lion's share of the runtime: arm64 goes through QEMU here.
      - name: Decide what to build
        id: plan
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "platforms=linux/amd64" >> "$GITHUB_OUTPUT"
            echo "publishing=false" >> "$GITHUB_OUTPUT"
            # A pull request writes no cache. If it did, an amd64-only layer
            # would overwrite the one from main and the next publishing build
            # would actually get slower.
            echo "cache_to=" >> "$GITHUB_OUTPUT"
          else
            echo "platforms=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
            echo "publishing=true" >> "$GITHUB_OUTPUT"
            echo "cache_to=type=gha,mode=max,scope=$REF_NAME" >> "$GITHUB_OUTPUT"
          fi

      # QEMU is there only to emulate arm64. Without arm64, setting it up is
      # wasted time.
      - name: Set up QEMU
        if: steps.plan.outputs.publishing == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: steps.plan.outputs.publishing == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/jeffreymooiweer/emcargo
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,prefix=

      - name: Build and optionally publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ steps.plan.outputs.platforms }}
          push: ${{ steps.plan.outputs.publishing == 'true' }}
          load: ${{ steps.plan.outputs.publishing == 'false' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=${{ github.ref_name }}
            type=gha,scope=main
          cache-to: ${{ steps.plan.outputs.cache_to }}

      - name: Check installed assistant runtime in container
        if: steps.plan.outputs.publishing == 'false'
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          image_tag="$(printf '%s\n' "$IMAGE_TAGS" | head -n 1)"
          docker run --rm --entrypoint python \
            -e PYTHONPATH=/app/backend \
            -v "$PWD/scripts/check_assistant_runtime.py:/tmp/check_assistant_runtime.py:ro" \
            "$image_tag" /tmp/check_assistant_runtime.py
