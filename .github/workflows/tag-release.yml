name: Tag release

# Creates the release tag on main and publishes the GitHub Release.
# Needed because tags pushed inside a workflow with GITHUB_TOKEN do not trigger
# new tag workflows; this workflow therefore does the release itself and starts
# CI (the Docker build) explicitly on the tag ref.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v prefix (e.g. 1.2.0); must match VERSION"
        required: true
      commit:
        description: "Commit on main to tag. Empty means the head of main. Fill this in to make a tag that was missed at the time."
        required: false
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: write
  packages: write
  actions: write

jobs:
  tag-and-release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.head.ref, 'agent/release-v'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || 'main' }}
          fetch-depth: 0

      # A release is normally started right after the merge, and then the head of
      # main is the commit to name. But the dispatch can be forgotten, and by the
      # time anyone notices, main has moved on and VERSION with it. The version
      # then no longer matches and the tag can never be made — while the commit
      # that deserves it is still sitting in the history, unchanged.
      #
      # So the commit may be named. Everything below reads from the checked-out
      # tree, so VERSION, CHANGELOG and the image SHA all come from that commit
      # instead of from today's main. The only thing to guard is that the commit
      # really is part of main: a tag on a stray branch would say released about
      # something that was never released.
      - name: Verify the commit is on main
        if: inputs.commit != ''
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD FETCH_HEAD; then
            echo "::error::Commit ${{ inputs.commit }} is not part of main."
            exit 1
          fi

      # Releasing does not change main. This step used to repair the version in
      # package-lock.json with a commit to main, and that slid main out from
      # under the next branch: it then conflicted on VERSION and CHANGELOG.md and
      # could only be merged after a rebase. The check itself is now a gate in the
      # CI of every pull request, so if it fails here something was merged that
      # should have been red — and then stopping is better than repairing.
      - name: Verify the version files agree
        run: python scripts/check_versions.py

      - name: Resolve and validate release version
        id: release
        shell: bash
        run: |
          FILE_VERSION="$(tr -d '[:space:]' < VERSION)"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RELEASE_VERSION="${{ inputs.version }}"
            if [ "$RELEASE_VERSION" != "$FILE_VERSION" ]; then
              echo "::error::Input version '$RELEASE_VERSION' does not match VERSION ($FILE_VERSION)."
              exit 1
            fi
          else
            RELEASE_VERSION="$FILE_VERSION"
            HEAD_REF="${{ github.event.pull_request.head.ref }}"
            case "$HEAD_REF" in
              agent/release-v"$RELEASE_VERSION"*) ;;
              *)
                echo "::error::Release branch '$HEAD_REF' does not match VERSION ($RELEASE_VERSION)."
                exit 1
                ;;
            esac
          fi

          echo "version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      # Tagging the head of main works and always has. A tag on an older commit is
      # refused, and the message says why: GITHUB_TOKEN belongs to a GitHub App,
      # and a ref carrying a different `.github/workflows/` tree than the default
      # branch counts to the remote as creating a workflow. That asks for a
      # `workflows` permission, and the `permissions:` block of a workflow has no
      # such key — it cannot be granted here at all.
      #
      # Measured, not assumed: `git/tags` accepts the tag object, and `git/refs`
      # then answers 403 "Resource not accessible by integration". So the API is
      # not a way round it either. The only credential that can make such a tag is
      # one with workflow scope of its own, and that has to be a secret. If
      # RELEASE_TOKEN exists the push uses it; if it does not, the step says what
      # is missing rather than failing on a line about permissions.
      - name: Create and push tag
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          if git ls-remote --exit-code --tags origin "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — skipping."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "EMCargo $TAG"

          if [ -n "$RELEASE_TOKEN" ]; then
            HEADER="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$RELEASE_TOKEN" | base64 -w0)"
            git -c http.extraheader="$HEADER" push origin "$TAG"
            exit 0
          fi

          if git push origin "$TAG"; then
            exit 0
          fi

          echo "::error::Could not push $TAG. A tag on a commit whose .github/workflows differs from the default branch needs a credential with workflow scope; add it as the RELEASE_TOKEN secret. Tagging the head of main does not need one."
          exit 1

      - name: Prepare release notes
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          VERSION="${{ steps.release.outputs.version }}"
          NOTES_FILE=".github/release-notes/${TAG}.md"
          if [ -f "$NOTES_FILE" ]; then
            cp "$NOTES_FILE" release-body.md
          else
            python3 - "$VERSION" <<'PY' > release-body.md
          import re
          import sys
          from pathlib import Path

          version = sys.argv[1]
          text = Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = rf"## \[{re.escape(version)}\][^\n]*\n(.*?)(?=\n## \[|\n## Previous releases|\Z)"
          match = re.search(pattern, text, re.DOTALL)
          print(match.group(1).strip() if match else f"Release {version}. See CHANGELOG.md for details.")
          PY
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — skipping."
          else
            gh release create "$TAG" --title "EMCargo $TAG" --notes-file release-body.md
          fi

      # The native bundle: what a host without Docker installs. The backend,
      # the templates, the changelog the what's-new card reads, the deploy
      # files, and the frontend built once here — the same tree the image
      # carries under /app, as a tarball the install script unpacks.
      - name: Set up Node for the native bundle
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the native bundle
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          (cd frontend && npm ci --no-audit && npm run build)
          STAGE="emcargo-$VERSION"
          rm -rf "$STAGE" && mkdir -p "$STAGE"
          cp -r backend templates deploy CHANGELOG.md VERSION LICENSE DISCLAIMER.md "$STAGE/"
          rm -rf "$STAGE/backend/tests" "$STAGE/backend/static"
          find "$STAGE" -name __pycache__ -type d -prune -exec rm -rf {} +
          cp -r frontend/dist "$STAGE/backend/static"
          tar -czf "emcargo-$VERSION-native.tar.gz" "$STAGE"
          sha256sum "emcargo-$VERSION-native.tar.gz" > "emcargo-$VERSION-native.tar.gz.sha256"
          ls -la emcargo-"$VERSION"-native.tar.gz*

      - name: Attach the native bundle to the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          TAG="${{ steps.release.outputs.tag }}"
          gh release upload "$TAG" "emcargo-$VERSION-native.tar.gz" "emcargo-$VERSION-native.tar.gz.sha256" --clobber

      # This used to say: build the image once more, now on the tag ref. That
      # cost four to six minutes to compile precisely the same commit again, plus
      # the test suites over it once more. Main had already built, tested and
      # pushed those bits under its short SHA.
      #
      # A tag is not a build but a name. `imagetools create` puts that name on
      # the existing manifest server-side — both architectures, in seconds,
      # without pulling a single layer. And it is stricter than a rebuild: the
      # released image is bit for bit the image that came green through CI,
      # instead of a second compilation that can come out slightly different.
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Name the image main already built
        env:
          VERSION: ${{ steps.release.outputs.version }}
          IMAGE: ghcr.io/jeffreymooiweer/emcargo
        run: |
          SHORT="$(git rev-parse --short=7 HEAD)"
          echo "Looking for $IMAGE:$SHORT — the image built from this very commit."

          # The release is usually started within a minute of the merge and the
          # build on main takes a few minutes, so some waiting is part of it.
          # Twenty minutes is generous; after that something is wrong and stopping
          # is better than a version tag on an image from yesterday.
          # Two names for one manifest. The in-app updater asked for the
          # v-prefixed form up to v1.136.0 and for the bare form from v1.137.0
          # on; an installation of the first generation can only update itself
          # if the tag it asks for exists. Naming costs nothing — no layer is
          # pulled or pushed — so both spellings are published.
          for attempt in $(seq 1 60); do
            if docker buildx imagetools inspect "$IMAGE:$SHORT" >/dev/null 2>&1; then
              docker buildx imagetools create -t "$IMAGE:$VERSION" -t "$IMAGE:v$VERSION" "$IMAGE:$SHORT"
              echo "$IMAGE:$VERSION and $IMAGE:v$VERSION now point at the same manifest as $IMAGE:$SHORT."
              docker buildx imagetools inspect "$IMAGE:$VERSION"
              exit 0
            fi
            echo "  not there yet (attempt $attempt), waiting 20s"
            sleep 20
          done

          echo "::error::$IMAGE:$SHORT never appeared. The build on main either failed or never ran, so there is no tested image to release."
          exit 1
