name: Read land regulations

# ADR, RID and ADN are published free of charge by UNECE and OTIF. The
# development container has no route to those hosts; a runner does. This
# workflow reads the official PDFs and prints the provisions EMCargo
# implements to the run log, so what the application does can be checked
# against what the regulation says.
#
# It commits nothing. The regulatory text is not ours to redistribute — only
# the factual values read out of it belong in the repository, and those go in
# through a separate, reviewed change.

on:
  # On request only. This used to run on every push that touched the reader,
  # which sounded harmless — reading a published regulation is safe to do early
  # and often — but it downloaded four PDFs of some 40 MB and quoted all six
  # groups every time, and it did so on a branch where nobody was reading the
  # log. Consulting a regulation is something you decide to do; it is not a
  # side effect of editing a file.
  workflow_dispatch:
    inputs:
      groups:
        description: "Which provisions to quote"
        type: choice
        options:
          - lq_eq
          - lq_marking
          - exemptions
          - mixed_loading
          - document
          - document_cases
          - tunnels
          - placarding
          - sea_placarding
          - security
          - all
          # A run that only wants a section, a phrase or a page should not
          # download three volumes to quote a group nobody asked for.
          - none
        default: lq_eq
      doc:
        description: "Restrict to these texts, comma separated. Downloadable: adr1, adr1_fr, adr2, adr2_fr, rid, adn, adn_fr. From the store: adr_nl_2025, adr_de_1, adr_de_2, adn_nl_2025, adn_de, rid_de, rid_fr. Empty means all that apply."
        default: ""
        required: false
      sections:
        description: "Extra section numbers, comma separated (e.g. 1.1.3.6.3,3.5.1.1)"
        default: ""
        required: false
      chars:
        description: "Length of an ad-hoc section quote"
        default: "2600"
        required: false
      find:
        description: "Locate a provision by a phrase when its number is unknown"
        default: ""
        required: false
      page:
        description: "Print a page verbatim, e.g. 594 or 600-606, when the number will not resolve"
        default: ""
        required: false
      # Chapter 3.3 is not quotable by section number: it is one run of a few
      # hundred numbered provisions, and the question asked of it — which of
      # them touch labelling — is a search, not a quote. So it gets its own
      # reader, run from here rather than from a workflow of its own, because a
      # workflow file only becomes dispatchable once it is on the default
      # branch and a reading tool should be usable on the branch that writes it.
      imdg_column_6:
        description: "Instead of quoting: find which IMDG 3.3 provisions cited by column 6 speak about labels"
        type: boolean
        default: false
      provisions:
        description: "imdg_column_6 only: extra provision numbers to print in full, comma separated"
        default: ""
        required: false
      only_these:
        description: "imdg_column_6 only: print nothing but the provisions named above"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install --quiet pymupdf

      # The same volumes the extraction workflow keeps. UNECE refuses a runner
      # outright and the Internet Archive, which is the way round, rate-limits —
      # so a run that re-fetches 19 MB to quote three lines is paying the one
      # cost that has actually broken runs here. `restore-keys` means a run that
      # needs a volume nobody has fetched yet still starts from the ones that
      # are already there.
      - name: Volumes already fetched
        uses: actions/cache/restore@v4
        with:
          path: /tmp/emcargo-regulations
          key: regulations-${{ github.run_id }}
          restore-keys: |
            regulations-

      # Every input arrives as an environment variable and is passed as an
      # argument, never spliced into the script text: a dispatch input is
      # someone else's typing, and a phrase to search for is exactly the kind
      # of input that carries quotes and spaces.
      - name: Quote the provisions
        env:
          # A push runs the whole set; a dispatch quotes what was asked for.
          GROUPS: ${{ inputs.groups || 'all' }}
          DOCS: ${{ inputs.doc }}
          SECTIONS: ${{ inputs.sections }}
          CHARS: ${{ inputs.chars }}
          FIND: ${{ inputs.find }}
          PAGE: ${{ inputs.page }}
          COLUMN_SIX: ${{ inputs.imdg_column_6 }}
          PROVISIONS: ${{ inputs.provisions }}
          ONLY_THESE: ${{ inputs.only_these }}
        run: |
          set -euo pipefail
          if [ "${COLUMN_SIX:-false}" = "true" ]; then
            ARGS=()
            if [ -n "$CHARS" ]; then
              ARGS+=(--chars "$(echo "$CHARS" | tr -d '[:space:]')")
            fi
            if [ -n "$PROVISIONS" ]; then
              IFS=',' read -ra WANTED <<< "$PROVISIONS"
              for n in "${WANTED[@]}"; do
                ARGS+=(--number "$(echo "$n" | tr -d '[:space:]')")
              done
              if [ "${ONLY_THESE:-false}" = "true" ]; then ARGS+=(--only); fi
            fi
            python scripts/read_imdg_special_provisions.py "${ARGS[@]}"
            exit 0
          fi
          ARGS=()
          if [ "$GROUPS" = "all" ]; then
            for g in lq_eq lq_marking exemptions mixed_loading document tunnels; do
              ARGS+=(--quote "$g")
            done
          elif [ "$GROUPS" != "none" ]; then
            ARGS+=(--quote "$GROUPS")
          fi
          if [ -n "$DOCS" ]; then
            IFS=',' read -ra WANTED <<< "$DOCS"
            for d in "${WANTED[@]}"; do
              ARGS+=(--doc "$(echo "$d" | tr -d '[:space:]')")
            done
          fi
          if [ -n "$FIND" ]; then ARGS+=(--find "$FIND"); fi
          if [ -n "$PAGE" ]; then ARGS+=(--page "$PAGE"); fi
          if [ -n "$CHARS" ]; then ARGS+=(--chars "$CHARS"); fi
          if [ -n "$SECTIONS" ]; then
            IFS=',' read -ra WANTED <<< "$SECTIONS"
            for s in "${WANTED[@]}"; do
              ARGS+=(--section "$(echo "$s" | tr -d '[:space:]')")
            done
          fi
          echo "read_land_regulations.py ${ARGS[*]}"
          python scripts/read_land_regulations.py "${ARGS[@]}"
