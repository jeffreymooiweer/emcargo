# Extracts the UN-card assets from the official UNECE English ADR 2025:
# the hazard label models of 5.2.2.2.2 (Volume I) as cropped PNGs, and the
# V/CV/S provision texts of 7.2.4, 7.5.11 and 8.5 (Volume II) as a seed
# file. Runs on a runner because the development container cannot reach
# unece.org; both downloads are verified against the SHA-256 the register
# (backend/seed/dg/sources.json) already records for these documents.
name: Extract UN card assets

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to run against and commit to
        required: true
        default: claude/volg-de-prompt-l58to6
      commit:
        description: Commit the extracted assets to the branch
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: extract-un-card-assets
  cancel-in-progress: false

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install extractor dependency
        run: pip install pymupdf

      # The regulations volumes fetched by earlier fetch-regulations runs
      # live in this cache; restoring it usually spares unece.org a request.
      - uses: actions/cache/restore@v4
        with:
          path: /tmp/emcargo-regulations
          key: regulations-${{ github.run_id }}
          restore-keys: |
            regulations-

      - name: Fetch and verify the UNECE English editions
        # regulations_store.py owns the download ladder (browser headers,
        # web-archive fallback) and refuses a file that contradicts the
        # SHA-256 pinned in the register. The ADN volume feeds the 7.1.6
        # provision texts.
        run: |
          python scripts/regulations_store.py fetch adr1 adr2 adn
          python scripts/regulations_store.py verify

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: /tmp/emcargo-regulations
          key: regulations-${{ github.run_id }}

      # Provision texts first: the two extractions are independent and one
      # failing must not hide the other's result.
      - name: Extract V/CV/S provision texts (Volume II)
        run: |
          python scripts/extract_adr_provision_texts.py \
            --pdf /tmp/emcargo-regulations/adr2.pdf \
            --out backend/seed/dg/adr_provision_texts.json \
            --source "ADR 2025, UNECE English edition (ECE/TRANS/352 Vol. II), sections 7.2.4, 7.5.11 and 8.5" \
            --lenient

      - name: Extract ADN 7.1.6 provision texts
        if: always()
        run: |
          python scripts/extract_adn_provision_texts.py \
            --pdf /tmp/emcargo-regulations/adn.pdf \
            --out backend/seed/dg/adn_provision_texts.json \
            --source "ADN 2025, UNECE English edition, section 7.1.6" \
            --lenient

      # Chapter 5.2 lives in Volume II (parts 4-9); Volume I carries parts
      # 1-3. The first run searched the wrong book and found nothing.
      - name: Extract hazard label models (Volume II, 5.2.2.2.2)
        if: always()
        run: |
          python scripts/extract_adr_label_models.py \
            --vol1 /tmp/emcargo-regulations/adr2.pdf \
            --vol-adr1 /tmp/emcargo-regulations/adr1.pdf \
            --out scripts/un_cards/assets/labels \
            --allow-missing

      # RID table A: the Dutch and OTIF English editions parsed as
      # independent readings of the same table, compared column by column
      # with the OTIF German edition arbitrating genuine print differences,
      # cross-checked against the shunting-label seed and the ADR identity
      # columns. Strict: a problem fails the run and nothing is committed.
      - name: Read RID table A from three editions
        run: |
          python scripts/regulations_store.py fetch rid || true
          python scripts/extract_rid_table_a.py --build \
            --out backend/seed/dg/rid_table_a.json

      - name: Commit extracted assets
        if: ${{ inputs.commit }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/un_cards/assets backend/seed/dg/adr_provision_texts.json \
                  backend/seed/dg/adn_provision_texts.json backend/seed/dg/rid_table_a.json
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "Extract UN card assets from the UNECE English ADR 2025"
            git push origin HEAD:${{ inputs.branch }}
          fi
