# EMCargo on Kubernetes: plain manifests, one file.
#
# What is here: a namespace, a persistent volume claim for /data, a secret
# for the first administrator's password, a config map for the rest of the
# environment, one replica of the image, a service, and an ingress you fill
# in. One replica on purpose: the application keeps a SQLite database in
# /data and takes a file lock on it; two pods on one volume would corrupt
# it. Updating is a rollout of a new image tag (`kubectl set image`), not the
# in-app updater, which needs a Docker socket a pod does not have.
#
#   kubectl apply -f emcargo.yaml
#   kubectl -n emcargo set image deployment/emcargo emcargo=ghcr.io/jeffreymooiweer/emcargo:1.181.0
#
# See docs/installation-native.md for the walk-through.
apiVersion: v1
kind: Namespace
metadata:
  name: emcargo
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: emcargo-data
  namespace: emcargo
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: emcargo-admin
  namespace: emcargo
type: Opaque
stringData:
  # The first administrator, created on the first start. Change it before applying.
  ADMIN_PASSWORD: "change-me-before-applying"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: emcargo-config
  namespace: emcargo
data:
  APP_ENV: "production"
  EMCARGO_MODE: "organisation"
  DATA_DIR: "/data"
  DATABASE_URL: "sqlite:////data/emcargo.db"
  ADMIN_USERNAME: "admin"
  ADMIN_EMAIL: "admin@example.local"
  CORS_ALLOWED_ORIGINS: "https://emcargo.example.com"
  PUBLIC_URL: "https://emcargo.example.com"
  TRUSTED_PROXY_HEADERS: "true"
  TRUSTED_PROXY_COUNT: "1"
  # Tells the settings screen which update route applies here.
  INSTALL_METHOD: "kubernetes"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: emcargo
  namespace: emcargo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: emcargo
  template:
    metadata:
      labels:
        app: emcargo
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: emcargo
          image: ghcr.io/jeffreymooiweer/emcargo:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: emcargo-config
            - secretRef:
                name: emcargo-admin
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              memory: "2Gi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: emcargo-data
---
apiVersion: v1
kind: Service
metadata:
  name: emcargo
  namespace: emcargo
spec:
  selector:
    app: emcargo
  ports:
    - port: 80
      targetPort: http
      name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: emcargo
  namespace: emcargo
  annotations:
    # Your ingress controller's TLS annotations go here (cert-manager, for example).
    nginx.ingress.kubernetes.io/proxy-body-size: "64m"
spec:
  rules:
    - host: emcargo.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: emcargo
                port:
                  name: http
  tls:
    - hosts: ["emcargo.example.com"]
      secretName: emcargo-tls
