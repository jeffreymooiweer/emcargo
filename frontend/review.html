<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>EMCargo responsive review</title>
<style>body{margin:0;background:#32363e;font:14px system-ui;color:#eee}header{padding:16px 24px}iframe{display:block;width:390px;height:844px;border:0;margin:0 24px 24px;background:#10151d}button{margin-left:12px;padding:8px 12px}a{color:inherit}</style></head>
<body><header>Responsive review · <span id="size">390</span> × 844 CSS viewport <button id="compact">Phone 355px</button><button id="tablet">Tablet 768px</button><button id="phone">Phone 390px</button><a href="/">Desktop</a></header><iframe title="EMCargo mobile viewport" src="/"></iframe>
<script type="module">const frame=document.querySelector('iframe');const resize=(width)=>{frame.style.width=width+'px';document.querySelector('#size').textContent=width;};document.querySelector('#compact').onclick=()=>resize(355);document.querySelector('#tablet').onclick=()=>resize(768);document.querySelector('#phone').onclick=()=>resize(390);</script></body></html>
